<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui.css"><title>Motrix 视频嗅探设置</title></head><body class="options"><main class="settings-card"><header><div class="brand"><span class="logo">M</span><div><strong>连接设置</strong><small>下载与 MP4 处理均由群晖执行</small></div></div></header><label>Motrix-SPK 服务器地址<input id="serverHost" type="url" placeholder="http://192.168.1.48" autocomplete="url"></label><label>服务端通信端口<input id="serverPort" type="number" min="1" max="65535" placeholder="请使用 Motrix-SPK 配对界面提供的端口"></label><div class="notice">身份验证由 Motrix-SPK 配对流程完成。扩展不会收集 DSM 密码或要求手动填写 RPC Secret。</div><div class="row"><label class="toggle"><input id="autoSniff" type="checkbox"> 自动嗅探</label><label>主题<select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></div><div class="actions"><button id="test" class="quiet">测试连接</button><button id="save" class="primary">保存设置</button></div><p id="feedback" class="feedback" role="status"></p><p class="privacy">连接、认证和任务提交遵循 Motrix-SPK 的 MDXP 0.10.0 与配对流程。媒体请求头仅会在用户提交任务时发往已配对的群晖，不上传至第三方。</p></main><script src="options.js"></script></body></html>
