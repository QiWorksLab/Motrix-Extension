<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui.css"><title>Motrix 视频嗅探设置</title></head><body class="options"><main class="settings-card"><header><div class="brand"><span class="logo">M</span><div><strong>连接设置</strong><small>下载与 MP4 处理均由群晖执行</small></div></div></header><label>Motrix-SPK 服务器地址<input id="serverHost" type="url" placeholder="http://192.168.1.48" autocomplete="url"></label><label>服务端通信端口<input id="serverPort" type="number" min="1" max="65535" placeholder="等待 docs/API.md 确认端口"></label><label>身份验证及 RPC Secret<input id="secret" type="password" autocomplete="new-password" placeholder="仅保存在本浏览器"></label><div class="row"><label class="toggle"><input id="autoSniff" type="checkbox"> 自动嗅探</label><label>主题<select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></div><div class="actions"><button id="test" class="quiet">测试连接</button><button id="save" class="primary">保存设置</button></div><p id="feedback" class="feedback" role="status"></p><p class="privacy">授权请求头仅在任务对接后发送到你配置的群晖服务器，不上传至第三方。服务端端口与认证方式以 Motrix-SPK/docs/API.md 为准。</p></main><script src="options.js"></script></body></html>
